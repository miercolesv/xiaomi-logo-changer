name: Release

# Pushing a tag such as v1.0 publishes the ready-made Mi 10 files in mi10/
# as a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mi10/*.zip --title "$GITHUB_REF_NAME" --notes-file mi10/NOTES.md
